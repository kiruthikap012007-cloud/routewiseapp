<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RouteWise — Book your next bus</title>
<style>
  :root {
    --bg: #F7F3EA;
    --card: #FFFFFF;
    --border: #E4DECF;
    --border2: #D9D1BE;
    --text: #1E1C18;
    --muted: #79715F;
    --muted-light: #9A937F;
    --accent: #DD7A34;
    --accent-dark: #C4672A;
    --taken: #B3A995;
    --error-text: #B0452C;
    --best: #3D7A5C;
    --best-bg: #E7F1EB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1, h2, h3 { font-family: Georgia, serif; margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .wrap-wide { max-width: 960px; }
  .wrap-narrow { max-width: 520px; }

  /* Nav */
  .nav { border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; }
  .logo { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: var(--text); font-size: 20px; font-weight: 700; font-family: Georgia, serif; }
  .nav-links { display: flex; gap: 24px; font-size: 14px; color: var(--muted); align-items: center; }
  .nav-links button { background: none; border: none; cursor: pointer; color: var(--text); text-decoration: underline; font-size: 14px; }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }

  /* Search screen */
  .search-page { padding: 64px 0 96px; }
  .search-page h1 { font-size: 44px; line-height: 1.15; margin-bottom: 20px; }
  .search-page p.lead { color: var(--muted); font-size: 17px; max-width: 42ch; margin-bottom: 40px; }
  .search-row { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 140px; }
  .field label { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); }
  input, select {
    background: var(--bg); border: 1px solid var(--border2); border-radius: 6px;
    padding: 12px 14px; font-size: 16px; color: var(--text); outline: none; width: 100%;
    font-family: inherit;
  }
  .swap-btn {
    align-self: center; margin-top: 22px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--border2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--muted);
  }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 12px 26px; font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-primary:disabled { background: var(--border2); cursor: not-allowed; }
  .btn-outline {
    border: 1px solid var(--border2); background: transparent; border-radius: 6px;
    padding: 8px 14px; font-size: 14px; color: var(--text); cursor: pointer;
  }
  .btn-back {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 4px; margin-bottom: 24px; padding: 0;
  }
  .error-text { color: var(--error-text); font-size: 14px; margin-top: 12px; }

  /* Results screen */
  .results-page { padding: 40px 0 96px; }
  .results-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .results-head h2 { font-size: 26px; }
  .results-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border2); background: transparent; color: var(--muted);
  }
  .chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .sort-select { margin-left: auto; border-radius: 999px; padding: 6px 12px; font-size: 13px; width: auto; }
  .empty-state { padding: 32px; text-align: center; color: var(--muted); }

  .bus-card { margin-bottom: 20px; }
  .bus-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .bus-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .bus-name { font-weight: 700; font-size: 17px; }
  .type-tag { font-size: 11px; color: var(--accent-dark); background: #FBE9DC; border-radius: 999px; padding: 2px 9px; }
  .bus-rating { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted-light); margin-bottom: 8px; }
  .bus-time { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .bus-time b { font-weight: 600; }
  .bus-time .dash { color: var(--muted-light); }
  .from-price { text-align: right; }
  .from-price .label { font-size: 11px; color: var(--muted-light); }
  .from-price .value { font-size: 20px; font-weight: 700; }

  .listing-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); margin-bottom: 8px;
  }
  .listing-row.best { border-color: var(--best); background: var(--best-bg); }
  .listing-left { display: flex; align-items: center; gap: 8px; }
  .listing-source { font-weight: 600; font-size: 14px; }
  .best-badge {
    font-size: 11px; color: var(--best); background: #fff; border-radius: 999px;
    padding: 2px 8px; display: flex; align-items: center; gap: 4px;
  }
  .listing-right { display: flex; align-items: center; gap: 16px; }
  .seats-left { font-size: 13px; color: var(--muted-light); }
  .seats-left.sold { color: var(--error-text); }
  .listing-price { font-weight: 700; font-size: 15px; }
  .btn-small { border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; background: var(--accent); }
  .btn-small:disabled { background: var(--border2); cursor: not-allowed; }

  /* Seat screen */
  .seats-page { padding: 40px 0 96px; }
  .seats-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .seats-head h2 { font-size: 24px; }
  .seats-head .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .seats-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  @media (min-width: 720px) { .seats-grid { grid-template-columns: 1fr 1fr; } }
  .seat-map-label { text-align: center; font-size: 12px; letter-spacing: 0.08em; color: var(--muted-light); margin-bottom: 16px; }
  .seat-rows { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .seat-row { display: flex; gap: 8px; }
  .seat-gap { width: 18px; }
  .seat-btn {
    width: 46px; height: 38px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--bg); border: 1px solid var(--border2); color: var(--text);
  }
  .seat-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seat-btn.taken { background: var(--taken); border-color: var(--taken); color: #fff; cursor: not-allowed; }
  .legend { display: flex; gap: 20px; justify-content: center; margin-top: 24px; font-size: 12px; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .booking-panel h3 { font-size: 19px; margin-bottom: 16px; }
  .booking-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .booking-row .k { color: var(--muted); }
  .booking-row .v { font-weight: 600; }
  .booking-row.total .v { font-weight: 700; font-size: 17px; }
  .field-label { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); display: block; margin-top: 16px; }
  .field-label.first { margin-top: 20px; }

  /* Confirm screen */
  .confirm-page { padding: 64px 0 96px; text-align: center; }
  .confirm-page h2 { font-size: 28px; margin: 20px 0 8px; }
  .confirm-page .sub { color: var(--muted); margin-bottom: 32px; }
  .ticket { text-align: left; }
  .ticket .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ticket .row:last-child { border-bottom: none; }
  .ticket .row .k { color: var(--muted); }
  .ticket .row .v { font-weight: 600; }
  .check-icon { color: var(--accent); }

  /* Login screen */
  .login-page { padding: 80px 0 96px; }
  .login-card { max-width: 380px; margin: 0 auto; }
  .login-card h2 { font-size: 26px; margin-bottom: 6px; text-align: center; }
  .login-card .sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 28px; }
  .login-card .field { margin-bottom: 16px; }
  .login-card .btn-primary { width: 100%; margin-top: 8px; }
  .login-hint { text-align: center; font-size: 12px; color: var(--muted-light); margin-top: 16px; }
  .nav-user { display: flex; align-items: center; gap: 12px; }
  .nav-user .greet { color: var(--text); font-weight: 600; }
  .link-btn { background: none; border: none; cursor: pointer; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 0; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <button class="logo" id="logoBtn">🚌 RouteWise</button>
    <div class="nav-links" id="navLinks"></div>
  </div>
</div>

<div id="app"></div>

<script>
// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------
const SOURCES = ["RedBus", "AbhiBus", "Chalo"];
const ROWS = ["A","B","C","D","E","F","G","H","I","J"];
const MAX_SEATS = 6;

const OPERATORS = [
  { id:"op1", name:"Sundaram Travels", type:"AC Sleeper", dep:"21:30", arr:"05:45", dur:"8h 15m", rating:4.2,
    listings: [
      { source:"RedBus", price:850, taken:["A2","B1","C3","D4","F2","G1","H3"] },
      { source:"AbhiBus", price:820, taken:["A2","B1","C3","D4","F2","G1","H3","H4"] },
      { source:"Chalo", price:865, taken:["A2","B1","C3","D4","F2"] },
    ]},
  { id:"op2", name:"KPN Travels", type:"AC Seater", dep:"22:15", arr:"06:00", dur:"7h 45m", rating:4.0,
    listings: [
      { source:"RedBus", price:720, taken:["A1","A2","B3","C1","C2","E4","F1","F4","I2"] },
      { source:"AbhiBus", price:699, taken:["A1","A2","B3","C1","C2","E4","F1","F4"] },
      { source:"Chalo", price:745, taken:["A1","A2","B3","C1","C2","E4","F1","F4","I2","I3"] },
    ]},
  { id:"op3", name:"Orange County Roadways", type:"Non-AC Seater", dep:"20:00", arr:"04:30", dur:"8h 30m", rating:3.6,
    listings: [
      { source:"RedBus", price:550, taken:["B2","B4","D1","D2","D3","G4","H1","J2","J3","J4"] },
      { source:"AbhiBus", price:560, taken:["B2","B4","D1","D2","D3","G4","H1","J2","J3"] },
      { source:"Chalo", price:525, taken:["B2","B4","D1","D2","D3","G4","H1","J2","J3","J4","A1"] },
    ]},
  { id:"op4", name:"Kallada Voyages", type:"AC Sleeper", dep:"23:00", arr:"07:10", dur:"8h 10m", rating:4.5,
    listings: [
      { source:"RedBus", price:990, taken:["A3","A4","C4","E1","E2"] },
      { source:"AbhiBus", price:1010, taken:["A3","A4","C4","E1"] },
      { source:"Chalo", price:965, taken:["A3","A4","C4","E1","E2","E3"] },
    ]},
  { id:"op5", name:"Parveen Travels", type:"AC Seater", dep:"07:30", arr:"15:00", dur:"7h 30m", rating:3.9,
    listings: [
      { source:"RedBus", price:680, taken:["A1","A2","A3","A4","B1","B2","H4","I1","I4","J1"] },
      { source:"AbhiBus", price:660, taken:["A1","A2","A3","A4","B1","B2","H4","I1","I4"] },
      { source:"Chalo", price:695, taken:["A1","A2","A3","A4","B1","B2","H4"] },
    ]},
];

const routeKey = (from, to) => `${from.trim().toLowerCase()}__${to.trim().toLowerCase()}`;
const ROUTES = {
  [routeKey("Chennai","Bengaluru")]: OPERATORS,
  [routeKey("Bengaluru","Chennai")]: OPERATORS.map(o => ({ ...o, id: o.id + "-r" })),
};
const CITIES = ["Chennai","Bengaluru","Coimbatore","Madurai","Salem","Trichy","Pondicherry","Hyderabad"];

const seatsLeft = (listing) => 40 - listing.taken.length;
const cheapestListing = (bus) => bus.listings.reduce((a,b) => b.price < a.price ? b : a);

// ---------------------------------------------------------------------------
// App state
// ---------------------------------------------------------------------------
const state = {
  screen: "login",
  isLoggedIn: false,
  username: "",
  loginUsername: "",
  loginPassword: "",
  loginError: "",
  from: "Chennai",
  to: "Bengaluru",
  date: "2026-09-08",
  searchError: "",
  results: [],
  resultsFilter: "All",
  resultsSort: "price",
  activeBus: null,
  activeListing: null,
  selectedSeats: [],
  passengerName: "",
  passengerPhone: "",
  seatErrors: {},
  booking: null,
};

function goSearch() {
  if (!state.isLoggedIn) { state.screen = "login"; render(); return; }
  state.screen = "search";
  state.searchError = "";
  render();
}

function doLogin() {
  const u = state.loginUsername.trim(), p = state.loginPassword;
  if (!u || !p) { state.loginError = "Enter both a username and password."; render(); return; }
  state.loginError = "";
  state.isLoggedIn = true;
  state.username = u;
  state.loginPassword = "";
  state.screen = "search";
  render();
}

function doLogout() {
  state.isLoggedIn = false;
  state.username = "";
  state.loginUsername = "";
  state.loginPassword = "";
  state.screen = "login";
  render();
}

function doSearch() {
  const from = state.from.trim(), to = state.to.trim();
  if (!from || !to) { state.searchError = "Enter both a departure and destination city."; render(); return; }
  if (from.toLowerCase() === to.toLowerCase()) { state.searchError = "Departure and destination can't be the same city."; render(); return; }
  state.searchError = "";
  state.results = ROUTES[routeKey(from, to)] || [];
  state.resultsFilter = "All";
  state.resultsSort = "price";
  state.screen = "results";
  render();
}

function selectListing(busId, source) {
  const bus = state.results.find(b => b.id === busId);
  const listing = bus.listings.find(l => l.source === source);
  state.activeBus = bus;
  state.activeListing = listing;
  state.selectedSeats = [];
  state.passengerName = "";
  state.passengerPhone = "";
  state.seatErrors = {};
  state.screen = "seats";
  render();
}

function toggleSeat(seatId) {
  const idx = state.selectedSeats.indexOf(seatId);
  if (idx >= 0) state.selectedSeats.splice(idx, 1);
  else if (state.selectedSeats.length < MAX_SEATS) state.selectedSeats.push(seatId);
  render();
}

function confirmBooking() {
  const errs = {};
  if (state.selectedSeats.length === 0) errs.seats = "Pick at least one seat.";
  if (!state.passengerName.trim()) errs.name = "Enter the passenger's name.";
  if (!/^[0-9]{10}$/.test(state.passengerPhone.trim())) errs.phone = "Enter a valid 10-digit number.";
  state.seatErrors = errs;
  if (Object.keys(errs).length > 0) { render(); return; }

  const total = state.selectedSeats.length * state.activeListing.price;
  const pnr = state.activeListing.source.slice(0,2).toUpperCase() + Math.random().toString(36).slice(2,8).toUpperCase();
  state.booking = {
    seats: [...state.selectedSeats],
    name: state.passengerName.trim(),
    phone: state.passengerPhone.trim(),
    total, pnr,
  };
  state.screen = "confirm";
  render();
}

function bookAnother() {
  state.activeBus = null;
  state.activeListing = null;
  state.booking = null;
  state.selectedSeats = [];
  state.screen = "search";
  render();
}

// ---------------------------------------------------------------------------
// Render helpers
// ---------------------------------------------------------------------------
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderLogin() {
  return `
    <div class="wrap login-page">
      <div class="card login-card">
        <h2>Log in to RouteWise</h2>
        <p class="sub">Use any username and password to continue.</p>
        <div class="field">
          <label>USERNAME</label>
          <input id="loginUsername" placeholder="Username" value="${esc(state.loginUsername)}" />
        </div>
        <div class="field">
          <label>PASSWORD</label>
          <input id="loginPassword" type="password" placeholder="Password" value="${esc(state.loginPassword)}" />
        </div>
        ${state.loginError ? `<p class="error-text">${esc(state.loginError)}</p>` : ""}
        <button class="btn-primary" id="loginBtn">Log in</button>
        <p class="login-hint">Demo login — no account needed, this just personalizes your session.</p>
      </div>
    </div>`;
}

function renderSearch() {
  const cityOptions = CITIES.map(c => `<option value="${esc(c)}">`).join("");
  return `
    <div class="wrap search-page">
      <h1>Book your next bus in a few taps.</h1>
      <p class="lead">Search a route and compare live availability across RedBus, AbhiBus and Chalo in one place — pick the best price, choose your seat, get an e-ticket.</p>
      <div class="card">
        <div class="search-row">
          <div class="field">
            <label>FROM</label>
            <input list="cities" id="fromInput" value="${esc(state.from)}" placeholder="City" />
          </div>
          <button class="swap-btn" id="swapBtn" title="Swap cities">⇄</button>
          <div class="field">
            <label>TO</label>
            <input list="cities" id="toInput" value="${esc(state.to)}" placeholder="City" />
          </div>
          <datalist id="cities">${cityOptions}</datalist>
          <div class="field">
            <label>DATE</label>
            <input type="date" id="dateInput" value="${esc(state.date)}" />
          </div>
          <div class="field" style="flex: 0 0 auto; justify-content: flex-end;">
            <label style="visibility:hidden;">go</label>
            <button class="btn-primary" id="searchBtn">Search buses</button>
          </div>
        </div>
        ${state.searchError ? `<p class="error-text">${esc(state.searchError)}</p>` : ""}
      </div>
    </div>`;
}

function renderListingRow(bus, listing, cheapest) {
  const left = seatsLeft(listing);
  const sold = left === 0;
  const isBest = listing.source === cheapest.source;
  return `
    <div class="listing-row ${isBest ? "best" : ""}">
      <div class="listing-left">
        <span class="listing-source">${esc(listing.source)}</span>
        ${isBest ? `<span class="best-badge">🏷 Best price</span>` : ""}
      </div>
      <div class="listing-right">
        <span class="seats-left ${sold ? "sold" : ""}">${sold ? "Sold out" : left + " left"}</span>
        <span class="listing-price">₹${listing.price}</span>
        <button class="btn-small" ${sold ? "disabled" : ""} onclick="selectListing('${bus.id}','${listing.source}')">Select seats</button>
      </div>
    </div>`;
}

function renderBusCard(bus) {
  const cheapest = cheapestListing(bus);
  const sortedListings = [...bus.listings].sort((a,b) => a.price - b.price);
  return `
    <div class="card bus-card">
      <div class="bus-top">
        <div>
          <div class="bus-name-row">
            <span class="bus-name">${esc(bus.name)}</span>
            <span class="type-tag">${esc(bus.type)}</span>
          </div>
          <div class="bus-rating">★ ${bus.rating}</div>
          <div class="bus-time"><b>${bus.dep}</b><span class="dash">— ${bus.dur} —</span><b>${bus.arr}</b></div>
        </div>
        <div class="from-price">
          <div class="label">from</div>
          <div class="value">₹${cheapest.price}</div>
        </div>
      </div>
      <div>${sortedListings.map(l => renderListingRow(bus, l, cheapest)).join("")}</div>
    </div>`;
}

function getFilteredSortedResults() {
  let list = state.results.filter(b => state.resultsFilter === "All" || b.type === state.resultsFilter);
  list = [...list].sort((a,b) => {
    if (state.resultsSort === "price") return cheapestListing(a).price - cheapestListing(b).price;
    if (state.resultsSort === "rating") return b.rating - a.rating;
    return a.dep.localeCompare(b.dep);
  });
  return list;
}

function renderResults() {
  const buses = state.results;
  const types = ["All", ...Array.from(new Set(buses.map(b => b.type)))];
  const filtered = getFilteredSortedResults();

  const chips = types.map(t => `<button class="chip ${state.resultsFilter === t ? "active" : ""}" onclick="setFilter('${esc(t)}')">${esc(t)}</button>`).join("");

  let body;
  if (buses.length === 0) {
    body = `<div class="card empty-state">No buses run this route yet. Try Chennai → Bengaluru, or the reverse.</div>`;
  } else {
    body = `
      <div class="filters">
        ${chips}
        <select class="sort-select" id="sortSelect">
          <option value="price" ${state.resultsSort === "price" ? "selected" : ""}>Sort: Best price</option>
          <option value="time" ${state.resultsSort === "time" ? "selected" : ""}>Sort: Departure</option>
          <option value="rating" ${state.resultsSort === "rating" ? "selected" : ""}>Sort: Rating</option>
        </select>
      </div>
      <div>${filtered.map(renderBusCard).join("")}</div>`;
  }

  return `
    <div class="wrap wrap-wide results-page">
      <button class="btn-back" id="backToSearchBtn">‹ Modify search</button>
      <div class="results-head">
        <h2>${esc(state.from)} → ${esc(state.to)}</h2>
        <span style="color:var(--muted);font-size:14px;">${esc(state.date)}</span>
      </div>
      <p class="results-sub">${buses.length} bus${buses.length !== 1 ? "es" : ""} found · comparing ${SOURCES.join(", ")}</p>
      ${body}
    </div>`;
}

function renderSeatMap(bus, listing) {
  let rowsHtml = "";
  for (const row of ROWS) {
    let seatsHtml = "";
    for (let n = 1; n <= 4; n++) {
      if (n === 3) seatsHtml += `<div class="seat-gap"></div>`;
      const id = `${row}${n}`;
      let cls = "seat-btn";
      let disabled = "";
      if (listing.taken.includes(id)) { cls += " taken"; disabled = "disabled"; }
      else if (state.selectedSeats.includes(id)) { cls += " selected"; }
      seatsHtml += `<button class="${cls}" ${disabled} onclick="toggleSeat('${id}')">${id}</button>`;
    }
    rowsHtml += `<div class="seat-row">${seatsHtml}</div>`;
  }
  return `
    <div class="card">
      <p class="seat-map-label">FRONT · DRIVER</p>
      <div class="seat-rows">${rowsHtml}</div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--bg);border:1px solid var(--border2);"></span>Available</span>
        <span><span class="swatch" style="background:var(--accent);"></span>Selected</span>
        <span><span class="swatch" style="background:var(--taken);"></span>Taken</span>
      </div>
    </div>`;
}

function renderBookingPanel(bus, listing) {
  const total = state.selectedSeats.length * listing.price;
  const errs = state.seatErrors;
  return `
    <div class="card booking-panel">
      <h3>Your booking</h3>
      <div class="booking-row"><span class="k">Booking via</span><span class="v">${esc(listing.source)}</span></div>
      <div class="booking-row"><span class="k">Selected seats</span><span class="v">${state.selectedSeats.length ? esc(state.selectedSeats.join(", ")) : "—"}</span></div>
      <div class="booking-row"><span class="k">Price per seat</span><span class="v">₹${listing.price}</span></div>
      <div class="booking-row total"><span class="k">Total</span><span class="v">₹${total}</span></div>
      ${errs.seats ? `<p class="error-text">${esc(errs.seats)}</p>` : ""}

      <label class="field-label first">PASSENGER NAME</label>
      <input id="nameInput" placeholder="Full name" value="${esc(state.passengerName)}" style="margin-top:6px;" />
      ${errs.name ? `<p class="error-text">${esc(errs.name)}</p>` : ""}

      <label class="field-label">PHONE NUMBER</label>
      <input id="phoneInput" placeholder="10-digit number" value="${esc(state.passengerPhone)}" style="margin-top:6px;" />
      ${errs.phone ? `<p class="error-text">${esc(errs.phone)}</p>` : ""}

      <button class="btn-primary" id="confirmBtn" style="width:100%;margin-top:20px;">Confirm booking</button>
    </div>`;
}

function renderSeats() {
  const bus = state.activeBus, listing = state.activeListing;
  return `
    <div class="wrap wrap-wide seats-page">
      <div class="seats-head">
        <div>
          <h2>Select your seats — ${esc(bus.name)}</h2>
          <div class="sub">${esc(state.from)} → ${esc(state.to)} · ${bus.dep} departure · ₹${listing.price} per seat · via ${esc(listing.source)}</div>
        </div>
        <button class="btn-outline" id="backToResultsBtn">← Back to buses</button>
      </div>
      <div class="seats-grid">
        ${renderSeatMap(bus, listing)}
        ${renderBookingPanel(bus, listing)}
      </div>
    </div>`;
}

function renderConfirm() {
  const b = state.booking, bus = state.activeBus, listing = state.activeListing;
  return `
    <div class="wrap wrap-narrow confirm-page">
      <div class="check-icon" style="font-size:48px;">✅</div>
      <h2>Booking confirmed</h2>
      <p class="sub">Your e-ticket for ${esc(bus.name)} via ${esc(listing.source)} has been generated.</p>
      <div class="card ticket">
        <div class="row"><span class="k">PNR</span><span class="v">${esc(b.pnr)}</span></div>
        <div class="row"><span class="k">Booked via</span><span class="v">${esc(listing.source)}</span></div>
        <div class="row"><span class="k">Route</span><span class="v">${esc(state.from)} → ${esc(state.to)}</span></div>
        <div class="row"><span class="k">Date · Departure</span><span class="v">${esc(state.date)} · ${bus.dep}</span></div>
        <div class="row"><span class="k">Passenger</span><span class="v">${esc(b.name)}</span></div>
        <div class="row"><span class="k">Seats</span><span class="v">${esc(b.seats.join(", "))}</span></div>
        <div class="row"><span class="k">Amount paid</span><span class="v">₹${b.total}</span></div>
      </div>
      <button class="btn-primary" id="bookAnotherBtn" style="margin-top:32px;">Book another trip</button>
    </div>`;
}

function setFilter(t) { state.resultsFilter = t; render(); }

function renderNav() {
  const navLinks = document.getElementById("navLinks");
  if (!navLinks) return;
  if (state.isLoggedIn) {
    navLinks.innerHTML = `
      <div class="nav-user">
        <span class="greet">Hi, ${esc(state.username)}</span>
        <button id="navSearchBtn">Search</button>
        <span>Buses</span>
        <span>Help</span>
        <button class="link-btn" id="logoutBtn">Log out</button>
      </div>`;
    document.getElementById("navSearchBtn").addEventListener("click", goSearch);
    document.getElementById("logoutBtn").addEventListener("click", doLogout);
  } else {
    navLinks.innerHTML = `<span>Buses</span><span>Help</span>`;
  }
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "login") app.innerHTML = renderLogin();
  else if (state.screen === "search") app.innerHTML = renderSearch();
  else if (state.screen === "results") app.innerHTML = renderResults();
  else if (state.screen === "seats") app.innerHTML = renderSeats();
  else if (state.screen === "confirm") app.innerHTML = renderConfirm();
  renderNav();
  attachHandlers();
}

function attachHandlers() {
  const on = (id, evt, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(evt, fn); };

  if (state.screen === "login") {
    on("loginUsername", "input", e => state.loginUsername = e.target.value);
    on("loginPassword", "input", e => state.loginPassword = e.target.value);
    on("loginBtn", "click", doLogin);
  }
  if (state.screen === "search") {
    on("fromInput", "input", e => state.from = e.target.value);
    on("toInput", "input", e => state.to = e.target.value);
    on("dateInput", "input", e => state.date = e.target.value);
    on("swapBtn", "click", () => { const t = state.from; state.from = state.to; state.to = t; render(); });
    on("searchBtn", "click", doSearch);
  }
  if (state.screen === "results") {
    on("backToSearchBtn", "click", goSearch);
    on("sortSelect", "change", e => { state.resultsSort = e.target.value; render(); });
  }
  if (state.screen === "seats") {
    on("backToResultsBtn", "click", () => { state.screen = "results"; render(); });
    on("nameInput", "input", e => state.passengerName = e.target.value);
    on("phoneInput", "input", e => { state.passengerPhone = e.target.value.replace(/[^0-9]/g,"").slice(0,10); e.target.value = state.passengerPhone; });
    on("confirmBtn", "click", confirmBooking);
  }
  if (state.screen === "confirm") {
    on("bookAnotherBtn", "click", bookAnother);
  }
}

document.getElementById("logoBtn").addEventListener("click", goSearch);

render();
</script>
</body>
</html>
